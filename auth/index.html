
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WOLCAS Auth</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial;
      margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; background:#fff; color:#111827; }
    .card { border:1px solid #e5e7eb; border-radius:12px; padding:16px; max-width:560px; width:92vw; }
    .muted { color:#6b7280; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin:0 0 8px 0;">Signing you in…</h2>
    <div class="muted">This window should close automatically.</div>
    <div id="status" class="muted" style="margin-top:10px;"></div>
  </div>

  ../msal-browser.min.js</script>
  <script>
    const APP = {
      clientId: "827656f8-3a21-4d69-b6e5-c35e2ec2fb71",
      tenantId: "97d84781-b85c-4034-a0d0-588e7b442e45",
      redirectUriMain: "https://abirrahat.github.io/wolcas-webapp/",
      redirectUriAuth: "https://abirrahat.github.io/wolcas-webapp/auth"
    };

    const msalConfig = {
      auth: {
        clientId: APP.clientId,
        authority: `https://login.microsoftonline.com/${APP.tenantId}`,
        redirectUri: APP.redirectUriAuth,
        navigateToLoginRequestUrl: false
      },
      cache: {
        cacheLocation: "localStorage",
        storeAuthStateInCookie: false
      }
    };

    const msalInstance = new msal.PublicClientApplication(msalConfig);

    (async function () {
      const el = document.getElementById("status");
      try {
        await msalInstance.handleRedirectPromise();
        el.textContent = "Done. Closing…";
        // MSAL stores tokens in the same-origin cache. Close popup.
        setTimeout(() => window.close(), 250);
      } catch (e) {
        console.error(e);
        el.textContent = "Auth failed. You can close this window.";
      }
    })();
  </script>
</body>
</html>
